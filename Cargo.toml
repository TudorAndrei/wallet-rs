[package]
name = "wallet-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wallet"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive", "env"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0.145"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
